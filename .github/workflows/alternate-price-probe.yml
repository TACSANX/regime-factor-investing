name: Alternate Price Coverage Probe

on:
  push:
    paths:
      - ".github/workflows/alternate-price-probe.yml"
      - "data/research/historical_price_download_failures.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alternate-price-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas requests
      - run: python -m py_compile alternate_price_probe.py
      - run: python alternate_price_probe.py
      - name: Publish probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research/alternate_price_stooq_probe.csv data/research/alternate_price_stooq_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: probe alternate historical price coverage"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
