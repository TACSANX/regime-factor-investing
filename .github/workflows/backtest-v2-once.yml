name: Bias-Reduced Backtest V2

on:
  push:
    paths:
      - ".github/workflows/backtest-v2-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bias-reduced-backtest-v2
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache_sp500_screener
          key: backtest-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            backtest-v2-${{ runner.os }}-
            backtest-${{ runner.os }}-
            screener-${{ runner.os }}-

      - name: Validate and test
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT"
          python -m py_compile screener.py backtest.py backtest_v2.py portfolio_constraints.py
          python test_offline.py
          python test_constraints.py

      - name: Run bias-reduced backtest
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python backtest_v2.py \
            --start 2018-01-01 \
            --end 2026-07-31 \
            --portfolio-n 10 \
            --cost-bps 10 \
            --max-stock-weight 0.12 \
            --max-sector-weight 0.30 \
            --output-dir data/backtest_v2

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bias-reduced-backtest-v2-${{ github.run_id }}
          path: data/backtest_v2/
          retention-days: 30

      - name: Publish results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/backtest_v2
          if git diff --cached --quiet; then
            echo "No v2 result changes."
            exit 0
          fi
          git commit -m "data: update bias-reduced backtest v2"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
