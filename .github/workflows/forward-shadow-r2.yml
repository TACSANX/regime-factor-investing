name: Frozen Forward Shadow R2 Simple

on:
  schedule:
    - cron: "25 8 1-3 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frozen-forward-shadow-2026-08-21-r2-simple
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore shared data cache
        uses: actions/cache@v4
        with:
          path: .cache_sp500_screener
          key: forward-shadow-r2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            forward-shadow-${{ runner.os }}-
            research-backtest-${{ runner.os }}-
            backtest-v2-${{ runner.os }}-
            screener-${{ runner.os }}-

      - name: Validate SEC user agent
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: test -n "$SEC_USER_AGENT"

      - name: Materialize frozen r2 model
        run: |
          frozen="$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open('forward_registry_r2.yaml'))['frozen_commit'])
          PY
          )"
          rm -rf /tmp/frozen_model_r2
          git worktree add --detach /tmp/frozen_model_r2 "$frozen"
          test "$(git -C /tmp/frozen_model_r2 rev-parse HEAD)" = "$frozen"

      - name: Validate tracker
        run: |
          python -m py_compile /tmp/frozen_model_r2/forward_shadow.py /tmp/frozen_model_r2/forward_shadow_r2.py
          python /tmp/frozen_model_r2/test_forward_shadow.py

      - name: Run r2 forward shadow
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python /tmp/frozen_model_r2/forward_shadow_r2.py \
            --model-root /tmp/frozen_model_r2 \
            --registry forward_registry_r2.yaml \
            --output-dir data/forward_shadow_r2

      - name: Upload r2 shadow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-shadow-r2-${{ github.run_id }}
          path: data/forward_shadow_r2/
          retention-days: 90

      - name: Commit r2 forward evidence
        run: |
          if [ ! -d data/forward_shadow_r2 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/forward_shadow_r2
          if git diff --cached --quiet; then
            echo "No r2 forward-shadow changes."
            exit 0
          fi
          git commit -m "data: update frozen forward shadow r2"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
