name: Frozen Forward Shadow

on:
  schedule:
    # Run on the first three calendar days so day 1 can preregister the target
    # after the prior US month-end close and day 2/3 can finalize the next-open
    # execution if that session was not available on the first run.
    - cron: "15 8 1-3 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frozen-forward-shadow-2026-08-21-r1
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore shared data cache
        uses: actions/cache@v4
        with:
          path: .cache_sp500_screener
          key: forward-shadow-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            research-backtest-${{ runner.os }}-
            backtest-v2-${{ runner.os }}-
            screener-${{ runner.os }}-

      - name: Validate SEC user agent
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: test -n "$SEC_USER_AGENT"

      - name: Materialize frozen model
        run: |
          rm -rf /tmp/frozen_model
          git worktree add --detach /tmp/frozen_model c9c82105036e15340f25eb9582a3ced354bb31d6
          test "$(git -C /tmp/frozen_model rev-parse HEAD)" = "$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open('forward_registry.yaml'))['frozen_commit'])
          PY
          )"

      - name: Validate tracker
        run: python -m py_compile forward_shadow.py

      - name: Run forward shadow
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python forward_shadow.py \
            --model-root /tmp/frozen_model \
            --registry forward_registry.yaml \
            --output-dir data/forward_shadow

      - name: Upload shadow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-shadow-${{ github.run_id }}
          path: data/forward_shadow/
          retention-days: 90

      - name: Commit forward evidence
        run: |
          if [ ! -d data/forward_shadow ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/forward_shadow
          if git diff --cached --quiet; then
            echo "No forward-shadow changes."
            exit 0
          fi
          git commit -m "data: update frozen forward shadow"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
