name: Historical Price Coverage

on:
  push:
    paths:
      - ".github/workflows/historical-price-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-price-coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python historical_price_coverage.py
      - name: Publish coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research/historical_price_coverage.csv data/research/historical_price_missing.csv data/research/historical_price_missing_summary.csv data/research/historical_price_coverage_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: measure historical Yahoo price coverage"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
