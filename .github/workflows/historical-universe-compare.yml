name: Historical Universe Comparison

on:
  push:
    paths:
      - ".github/workflows/historical-universe-compare.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-universe-comparison
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas numpy requests
      - run: python historical_universe_compare.py
      - name: Publish comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research/historical_universe_comparison.csv data/research/historical_universe_mismatches.csv data/research/historical_universe_quality.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: compare historical S&P 500 universes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
