name: Official S&P 500 Change Audit

on:
  push:
    paths:
      - ".github/workflows/official-sp500-change-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-sp500-change-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile historical_universe_compare.py official_sp500_change_audit.py
      - run: python official_sp500_change_audit.py
      - name: Publish audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research/official_sp500_change_audit.csv data/research/official_sp500_change_audit_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: audit official S&P constituent changes"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
