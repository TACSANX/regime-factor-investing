name: PIT Index Audit

on:
  push:
    paths:
      - ".github/workflows/pitindex-audit.yml"
      - "pitindex_audit.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pitindex-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas numpy requests pitindex==0.2.1
      - run: python -m py_compile historical_universe_compare.py official_sp500_change_audit.py pitindex_audit.py
      - run: python pitindex_audit.py
      - name: Publish PIT audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/research/pitindex_official_event_audit.csv \
            data/research/pitindex_pierre_monthly_compare.csv \
            data/research/pitindex_audit_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: audit pitindex historical membership"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
