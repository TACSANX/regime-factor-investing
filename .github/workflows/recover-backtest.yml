name: Recover Backtest Artifact

on:
  push:
    paths:
      - ".github/workflows/recover-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-backtest-artifact
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and download latest completed backtest artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/backtest /tmp/backtest-artifact

          artifact_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name | startswith("historical-backtest-")) and (.expired == false))] | sort_by(.created_at) | reverse | .[0]')

          if [ -z "$artifact_json" ] || [ "$artifact_json" = "null" ]; then
            echo "::error::No non-expired historical-backtest artifact found."
            exit 1
          fi

          artifact_id=$(printf '%s' "$artifact_json" | jq -r '.id')
          artifact_name=$(printf '%s' "$artifact_json" | jq -r '.name')
          run_id=$(printf '%s' "$artifact_json" | jq -r '.workflow_run.id')
          created_at=$(printf '%s' "$artifact_json" | jq -r '.created_at')

          echo "Recovering ${artifact_name} (artifact=${artifact_id}, run=${run_id}, created=${created_at})"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o /tmp/backtest.zip

          unzip -q /tmp/backtest.zip -d /tmp/backtest-artifact

          for file in summary.csv equity_curve.csv holdings.csv assumptions.csv run.log exit_code.txt; do
            src=$(find /tmp/backtest-artifact -type f -name "$file" -print -quit || true)
            if [ -n "$src" ]; then
              cp "$src" "data/backtest/$file"
            fi
          done

          test -s data/backtest/summary.csv
          test -s data/backtest/equity_curve.csv
          test -s data/backtest/holdings.csv
          test -s data/backtest/assumptions.csv

          cat > data/backtest/recovery_source.txt <<EOF
          artifact_name=${artifact_name}
          artifact_id=${artifact_id}
          workflow_run_id=${run_id}
          artifact_created_at=${created_at}
          recovered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit recovered results to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/backtest
          git commit -m "data: recover completed historical backtest"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish recovered backtest results."
          exit 1
