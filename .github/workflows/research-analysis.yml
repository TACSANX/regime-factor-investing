name: Research Analysis

on:
  push:
    paths:
      - "research_analysis.py"
      - ".github/workflows/research-analysis.yml"
      - "data/backtest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run robustness analysis
        run: python research_analysis.py

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research
          if git diff --cached --quiet; then
            echo "No research output changes."
            exit 0
          fi
          git commit -m "data: update robustness research"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
