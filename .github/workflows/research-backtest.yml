name: Research Backtest Matrix

on:
  push:
    paths:
      - ".github/workflows/research-backtest.yml"
      - "research_backtest.py"
      - "research_candidates.py"
      - "quality_research.py"
      - "test_quality_research.py"
      - "research_validation.py"
      - "research_overfit.py"
      - "research_overfit_sensitivity.py"
      - "component_attribution.py"
      - "research_trial_ledger.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-backtest-matrix
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore research data cache
        uses: actions/cache@v4
        with:
          path: .cache_sp500_screener
          key: research-backtest-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            research-backtest-${{ runner.os }}-
            backtest-v2-${{ runner.os }}-
            backtest-${{ runner.os }}-
            screener-${{ runner.os }}-

      - name: Validate code
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT"
          python -m py_compile \
            screener.py backtest.py backtest_v2.py portfolio_constraints.py \
            research_backtest.py research_candidates.py quality_research.py \
            research_validation.py research_overfit.py research_overfit_sensitivity.py \
            component_attribution.py test_quality_research.py
          python test_offline.py
          python test_constraints.py
          python test_quality_research.py

      - name: Run research matrix
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python research_candidates.py \
            --start 2018-01-01 \
            --end 2026-07-31 \
            --cost-bps 10 \
            --min-valid-weight 0.95 \
            --output-dir data/research_backtest

      # Run every diagnostic against the exact matrix produced above. Commits
      # made by GITHUB_TOKEN do not recursively trigger downstream workflows,
      # so validation must be atomic with the matrix run to avoid stale DSR/PBO.
      - name: Run statistical validation
        run: |
          python research_validation.py
          python research_overfit.py
          python research_overfit_sensitivity.py
          python component_attribution.py

      # Results are versioned in git, so a second copy in Actions artifact
      # storage is intentionally omitted.
      - name: Publish research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research_backtest
          if git diff --cached --quiet; then
            echo "No research result changes."
            exit 0
          fi
          git commit -m "data: update research matrix and validation"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
