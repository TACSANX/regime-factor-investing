name: Research Overfit Sensitivity

on:
  push:
    paths:
      - ".github/workflows/research-overfit-sensitivity.yml"
      - "research_overfit.py"
      - "research_overfit_sensitivity.py"
      - "research_trial_ledger.csv"
      - "data/research_backtest/monthly.csv"
      - "data/research_backtest/strategy_specs.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-overfit-sensitivity
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas numpy
      - run: python -m py_compile research_overfit.py research_overfit_sensitivity.py
      - run: python research_overfit_sensitivity.py
      - name: Publish sensitivity diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/research_backtest/dsr_trial_count_sensitivity.csv \
            data/research_backtest/pbo_block_sensitivity.csv \
            data/research_backtest/overfit_sensitivity_status.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update overfit sensitivity diagnostics"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
