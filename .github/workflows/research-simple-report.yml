name: Lightweight Research Report

on:
  push:
    paths:
      - "research_simple_report.py"
      - "research_shortlist.py"
      - ".github/workflows/research-simple-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightweight-research-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - run: python -m py_compile research_simple_report.py research_shortlist.py
      - run: |
          python research_simple_report.py
          python research_shortlist.py
      - name: Publish lightweight research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/research_backtest/simple_market_states.csv \
            data/research_backtest/simple_regime_summary.csv \
            data/research_backtest/simple_yearly.csv \
            data/research_backtest/simple_stability.csv \
            data/research_backtest/simple_pairwise.csv \
            data/research_backtest/simple_cost_sensitivity.csv \
            data/research_backtest/shortlist.csv
          if git diff --cached --quiet; then
            echo "No research output changes."
            exit 0
          fi
          git commit -m "data: update lightweight research report"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
