name: Static Primary Diagnostics

# Committed-data-only diagnostics: no Yahoo, SEC, or FRED refetch.
on:
  push:
    paths:
      - "research_winner_stress.py"
      - "research_simple_primary_overfit.py"
      - "research_simple_primary_relative_risk.py"
      - "research_static_cost.py"
      - "research_trial_ledger.csv"
      - ".github/workflows/research-static-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-static-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate diagnostics
        run: |
          python -m py_compile \
            research_winner_stress.py \
            research_simple_primary_overfit.py \
            research_simple_primary_relative_risk.py \
            research_static_cost.py
      - name: Run diagnostics and persist status
        id: diagnostics
        continue-on-error: true
        run: |
          mkdir -p data/research_backtest
          : > data/research_backtest/static_diagnostics.log
          : > data/research_backtest/static_diagnostics_status.txt
          overall=0
          for script in \
            research_winner_stress.py \
            research_simple_primary_overfit.py \
            research_simple_primary_relative_risk.py \
            research_static_cost.py
          do
            echo "=== ${script} ===" | tee -a data/research_backtest/static_diagnostics.log
            set +e
            python "$script" >> data/research_backtest/static_diagnostics.log 2>&1
            code=$?
            set -e
            echo "${script}=${code}" | tee -a data/research_backtest/static_diagnostics_status.txt
            if [ "$code" -ne 0 ]; then overall=1; fi
          done
          echo "overall=${overall}" | tee -a data/research_backtest/static_diagnostics_status.txt
          exit "$overall"
      - name: Publish diagnostics and failure evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/research_backtest
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "data: update static-primary diagnostics"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Fail if a diagnostic failed
        if: steps.diagnostics.outcome == 'failure'
        run: exit 1
