name: Static Neutral Equal Control

on:
  push:
    paths:
      - "research_static_equal.py"
      - ".github/workflows/research-static-equal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-static-equal
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research_static_equal.py
      - run: python research_static_equal.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/research_backtest/static_equal_monthly.csv \
            data/research_backtest/static_equal_summary.csv \
            data/research_backtest/macro_equal_pairwise.csv
          if git diff --cached --quiet; then
            echo "No static-equal result changes."
            exit 0
          fi
          git commit -m "data: update static-neutral equal control"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
