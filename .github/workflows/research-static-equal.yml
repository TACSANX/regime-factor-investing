name: Static Neutral Equal Control

on:
  push:
    paths:
      - "research_static_equal.py"
      - "research_static_equal_validate.py"
      - "research_macro_detail.py"
      - "research_static_contribution.py"
      - "research_winner_stress.py"
      - "research_simple_primary_overfit.py"
      - "research_simple_primary_relative_risk.py"
      - "research_static_cost.py"
      - "research_trial_ledger.csv"
      - ".github/workflows/research-static-equal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-static-equal
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research_static_equal.py research_static_equal_validate.py research_macro_detail.py research_static_contribution.py research_winner_stress.py research_simple_primary_overfit.py research_simple_primary_relative_risk.py research_static_cost.py
      - run: |
          python research_static_equal.py
          python research_static_equal_validate.py
          python research_macro_detail.py
          python research_static_contribution.py
          python research_winner_stress.py
          python research_simple_primary_overfit.py
          python research_simple_primary_relative_risk.py
          python research_static_cost.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/research_backtest/static_equal_monthly.csv \
            data/research_backtest/static_equal_summary.csv \
            data/research_backtest/macro_equal_pairwise.csv \
            data/research_backtest/static_equal_validation.csv \
            data/research_backtest/static_equal_yearly.csv \
            data/research_backtest/static_equal_loo.csv \
            data/research_backtest/static_equal_loo_summary.csv \
            data/research_backtest/static_equal_regime.csv \
            data/research_backtest/macro_equal_regime_delta.csv \
            data/research_backtest/macro_equal_year_delta.csv \
            data/research_backtest/macro_equal_selection_overlap.csv \
            data/research_backtest/macro_equal_selection_summary.csv \
            data/research_backtest/macro_equal_selection_by_regime.csv \
            data/research_backtest/static_equal_contribution_detail.csv \
            data/research_backtest/static_equal_symbol_contribution.csv \
            data/research_backtest/static_equal_sector_contribution.csv \
            data/research_backtest/static_equal_contribution_summary.csv \
            data/research_backtest/static_equal_winner_stress.csv \
            data/research_backtest/static_equal_winner_stress_monthly.csv \
            data/research_backtest/simple_primary_dsr_sensitivity.csv \
            data/research_backtest/simple_primary_pbo_sensitivity.csv \
            data/research_backtest/simple_primary_overfit_status.csv \
            data/research_backtest/simple_primary_relative_path.csv \
            data/research_backtest/simple_primary_relative_rolling.csv \
            data/research_backtest/simple_primary_relative_risk.csv \
            data/research_backtest/static_equal_cost_sensitivity.csv
          if git diff --cached --quiet; then
            echo "No static-equal result changes."
            exit 0
          fi
          git commit -m "data: update static-neutral equal control"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
