name: Lightweight Tail-Risk Research

on:
  push:
    paths:
      - "research_tail_risk.py"
      - ".github/workflows/research-tail-risk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lightweight-tail-risk-research
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: python -m pip install pandas numpy

      - name: Run diagnostics
        run: python research_tail_risk.py

      - name: Publish diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research_backtest/tail_risk_summary.csv data/research_backtest/worst_months.csv data/research_backtest/concentration_diagnostics.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: update tail-risk diagnostics"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
