name: Tiingo Metadata Coverage Audit

on:
  push:
    paths:
      - "tiingo_metadata_audit.py"
      - ".github/workflows/tiingo-metadata-audit.yml"
      - "data/research/historical_price_download_failures.csv"
      - "data/research/historical_price_missing.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiingo-metadata-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pandas numpy requests
      - run: python -m py_compile tiingo_metadata_audit.py
      - run: python tiingo_metadata_audit.py
      - name: Publish metadata audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/research/tiingo_metadata_coverage.csv data/research/tiingo_metadata_coverage_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: audit Tiingo historical price metadata"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
