cache_dir: .cache_sp500_screener
cache_hours:
  universe: 12
  sec: 24
  macro: 6
price_period: 2y
price_batch_size: 80
min_history_days: 260
min_data_completeness: 0.45
top_n: 20
portfolio_n: 10

# Concentration is allowed in the live reference portfolio. These values are
# intentionally non-binding; research outputs report realized concentration
# instead of forcing arbitrary stock/sector caps.
max_stock_weight: 1.0
max_sector_weight: 1.0
trend_gate: true

